x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/field_shift
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: field_shift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - field_shift_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d field_shift"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - field_shift_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    profiles: ["backend"]
    build:
      context: .
    <<: *backend-env
    command: ["sh", "-c", "python -m config.validate && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["backend"]
    build:
      context: .
    <<: *backend-env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/field_shift
      REDIS_URL: redis://redis:6379/0
      # SUGGESTION_ENGINE_URL and SUGGESTION_ENGINE_API_KEY are read from .env
      # In production: https://fieldshift-suggestion-engine-32936898580.asia-south1.run.app
      # In local dev:  http://suggestion-engine:8000  (use --profile local-engine)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  suggestion-engine:
    profiles: ["local-engine"]
    build:
      context: ../suggestion-engine
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY pyproject.toml readme.md ./
        COPY src ./src
        COPY knowledge ./knowledge
        COPY contracts ./contracts
        RUN pip install --no-cache-dir -e .
        CMD ["uvicorn", "fieldshift.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      FIELDSHIFT_API_KEY: ${SUGGESTION_ENGINE_API_KEY:-}
      FIELDSHIFT_SEASON_CYCLE: kharif,rabi
      PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["backend"]
    build:
      context: .
    <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    profiles: ["backend"]
    build:
      context: .
    <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  field_shift_postgres_data:
  field_shift_redis_data:
