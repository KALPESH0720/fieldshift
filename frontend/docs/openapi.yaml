openapi: 3.1.0
info:
  title: Field Shift API
  version: 0.1.0-draft
  summary: Draft backend contract derived from the Field Shift PWA integration blueprint.
  description: |
    Base path is /api/v1. Authenticated requests use secure HttpOnly cookies.
    Mutating cookie-authenticated requests also require X-CSRF-Token. Lists use
    cursor pagination. Errors use ErrorEnvelope. All ownership/group scope checks
    are server-side. This draft is a proposal, not an implemented API.
servers:
  - url: https://api.example.org/api/v1
    description: Replace with deployed API URL
  - url: /api/v1
    description: Same-origin reverse proxy
tags:
  - name: Auth
  - name: Profile
  - name: Plots
  - name: Land Registry
  - name: Recommendations
  - name: Soil
  - name: Pest
  - name: Market
  - name: Weather
  - name: Schemes
  - name: Dealers
  - name: Notifications
  - name: Groups
  - name: Catalog
  - name: Files
  - name: Sync
security:
  - sessionCookie: []
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: |
            Challenge accepted for login or new-farmer sign-up. Response must not
            disclose whether the E.164 phone number is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        'default': { $ref: '#/components/responses/ApiError' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: |
            OTP verified and session established; server sets HttpOnly access and
            refresh cookies. Returns isNewUser=true when the farmer record was newly
            created or still requires profile completion (displayName, preferredLocale, consents).
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite session cookies.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh token rotated; access and refresh cookies set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Refresh session revoked and cookies cleared.
        'default': { $ref: '#/components/responses/ApiError' }
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      responses:
        '200':
          description: Current user and scoped roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
    patch:
      tags: [Profile]
      operationId: updateMe
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        'default': { $ref: '#/components/responses/ApiError' }
  /me/preferences:
    get:
      tags: [Profile]
      operationId: getPreferences
      responses:
        '200':
          description: Current profile preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preference' }
        'default': { $ref: '#/components/responses/ApiError' }
    put:
      tags: [Profile]
      operationId: putPreferences
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceInput' }
      responses:
        '200':
          description: Saved preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preference' }
        'default': { $ref: '#/components/responses/ApiError' }
  /plots:
    get:
      tags: [Plots]
      operationId: listPlots
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string } }
        - { name: village, in: query, schema: { type: string } }
        - { name: isVerified, in: query, schema: { type: boolean } }
        - { name: source, in: query, schema: { type: string } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
        - { name: bbox, in: query, description: west,south,east,north; WGS84., schema: { type: string } }
      responses:
        '200':
          description: Owned or authorized plots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotPage' }
        'default': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Plots]
      operationId: createPlot
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotCreate' }
      responses:
        '201':
          description: Created plot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
        'default': { $ref: '#/components/responses/ApiError' }
  /plots/{plotId}:
    parameters:
      - { $ref: '#/components/parameters/PlotId' }
    get:
      tags: [Plots]
      operationId: getPlot
      responses:
        '200':
          description: Plot detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
        'default': { $ref: '#/components/responses/ApiError' }
    patch:
      tags: [Plots]
      operationId: updatePlot
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotPatch' }
      responses:
        '200':
          description: Updated plot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
        'default': { $ref: '#/components/responses/ApiError' }
    delete:
      tags: [Plots]
      operationId: deletePlot
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Plot tombstone recorded. }
        'default': { $ref: '#/components/responses/ApiError' }
  /plots/{plotId}/seasons:
    parameters:
      - { $ref: '#/components/parameters/PlotId' }
    get:
      tags: [Plots]
      operationId: listPlotSeasons
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Crop assignments for plot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotSeasonPage' }
        'default': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Plots]
      operationId: createPlotSeason
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotSeasonCreate' }
      responses:
        '201':
          description: Crop assignment saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotSeason' }
        'default': { $ref: '#/components/responses/ApiError' }
  /plots/{plotId}/seasons/{assignmentId}:
    parameters:
      - { $ref: '#/components/parameters/PlotId' }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Plots]
      operationId: updatePlotSeason
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotSeasonPatch' }
      responses:
        '200':
          description: Assignment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotSeason' }
        'default': { $ref: '#/components/responses/ApiError' }
  /land-registries/providers:
    get:
      tags: [Land Registry]
      operationId: listRegistryProviders
      parameters:
        - { name: countryCode, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 2 } }
      responses:
        '200':
          description: Available provider capabilities for country.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderPage' }
        'default': { $ref: '#/components/responses/ApiError' }
  /land-registries/consents:
    post:
      tags: [Land Registry]
      operationId: startRegistryConsent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentCreate' }
      responses:
        '201':
          description: Consent flow created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStartResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
  /land-registries/callbacks/{providerId}:
    post:
      tags: [Land Registry]
      operationId: registryProviderCallback
      security: []
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - { name: X-Provider-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCallback' }
      responses:
        '202': { description: Callback verified and processing queued. }
        'default': { $ref: '#/components/responses/ApiError' }
  /land-registries/consents/{consentId}:
    parameters:
      - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Land Registry]
      operationId: revokeRegistryConsent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '204': { description: Consent revoked; provider revocation may complete asynchronously. }
        'default': { $ref: '#/components/responses/ApiError' }
    get:
      tags: [Land Registry]
      operationId: getRegistryConsent
      responses:
        '200':
          description: Consent status and scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandRegistryConsent' }
        'default': { $ref: '#/components/responses/ApiError' }
  /land-registries/consents/{consentId}/parcels:
    parameters:
      - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Land Registry]
      operationId: listRegistryParcels
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Parcels available through this consent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelPage' }
        'default': { $ref: '#/components/responses/ApiError' }
  /plots/import-land-parcels:
    post:
      tags: [Land Registry]
      operationId: importLandParcels
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParcelImportRequest' }
      responses:
        '200':
          description: Existing or new parcels imported idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelImportResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
  /recommendations:
    post:
      tags: [Recommendations]
      operationId: createRecommendation
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200':
          description: Recommendation calculated synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }
        '202':
          description: Recommendation job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        'default': { $ref: '#/components/responses/ApiError' }
  /recommendations/{recommendationId}:
    get:
      tags: [Recommendations]
      operationId: getRecommendation
      parameters:
        - { name: recommendationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Recommendation and ranked crop results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }
        'default': { $ref: '#/components/responses/ApiError' }
  /soil-records:
    get:
      tags: [Soil]
      operationId: listSoilRecords
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: plotId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Soil record page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilRecordPage' }
        'default': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Soil]
      operationId: createSoilRecord
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilRecordCreate' }
      responses:
        '201':
          description: Soil measurements saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilRecord' }
        'default': { $ref: '#/components/responses/ApiError' }
  /soil-records/{soilRecordId}:
    parameters:
      - { name: soilRecordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Soil]
      operationId: getSoilRecord
      responses:
        '200':
          description: Soil record detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilRecord' }
        'default': { $ref: '#/components/responses/ApiError' }
    patch:
      tags: [Soil]
      operationId: updateSoilRecord
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilRecordPatch' }
      responses:
        '200':
          description: Corrected soil record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilRecord' }
        'default': { $ref: '#/components/responses/ApiError' }
    delete:
      tags: [Soil]
      operationId: deleteSoilRecord
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Tombstone recorded. }
        'default': { $ref: '#/components/responses/ApiError' }
  /soil-records/ocr:
    post:
      tags: [Soil]
      operationId: startSoilOcr
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilOcrRequest' }
      responses:
        '202':
          description: OCR job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        'default': { $ref: '#/components/responses/ApiError' }
  /jobs/{jobId}:
    get:
      tags: [Soil, Pest]
      operationId: getJob
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Job status; result appears when done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        'default': { $ref: '#/components/responses/ApiError' }
  /pest-scans:
    get:
      tags: [Pest]
      operationId: listPestScans
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: plotId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Pest scan page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestScanPage' }
        'default': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Pest]
      operationId: startPestScan
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestScanRequest' }
      responses:
        '202':
          description: Scan queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        'default': { $ref: '#/components/responses/ApiError' }
  /pest-scans/{scanId}:
    get:
      tags: [Pest]
      operationId: getPestScan
      parameters:
        - { name: scanId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Diagnosis and reviewed advice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestScan' }
        'default': { $ref: '#/components/responses/ApiError' }
  /market/prices:
    get:
      tags: [Market]
      operationId: listMarketPrices
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: countryCode, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: state, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: market, in: query, schema: { type: string } }
        - { name: cropId, in: query, schema: { type: string } }
        - { name: variety, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: unit, in: query, schema: { type: string } }
      responses:
        '200':
          description: Market price page and source freshness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPricePage' }
        'default': { $ref: '#/components/responses/ApiError' }
  /market/prices/{cropId}/history:
    get:
      tags: [Market]
      operationId: getCropMarketHistory
      security: []
      parameters:
        - { name: cropId, in: path, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [7D, 30D, 90D, 1Y], default: 30D } }
        - { name: countryCode, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: market, in: query, schema: { type: string } }
      responses:
        '200':
          description: Historical price series, key statistics, nearby market comparison, and rule-based seasonal analysis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cropId: { type: string }
                  range: { type: string }
                  currentPrice: { type: number }
                  unit: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        price: { type: number }
                        lastYearPrice: { type: number }
                        minPrice: { type: number }
                        maxPrice: { type: number }
        'default': { $ref: '#/components/responses/ApiError' }
  /market/markets:
    get:
      tags: [Market]
      operationId: listRegionalMarkets
      security: []
      parameters:
        - { name: countryCode, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
      responses:
        '200':
          description: Available regional wholesale agricultural markets and latest crop prices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        region: { type: string }
                        distanceKm: { type: number }
        'default': { $ref: '#/components/responses/ApiError' }
  /market/alerts:
    get:
      tags: [Market]
      operationId: listPriceAlerts
      responses:
        '200':
          description: Active and triggered crop price alerts for the authenticated farmer.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    cropId: { type: string }
                    targetPrice: { type: number }
                    direction: { type: string, enum: [above, below] }
                    active: { type: boolean }
        'default': { $ref: '#/components/responses/ApiError' }
    post:
      tags: [Market]
      operationId: createPriceAlert
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cropId, targetPrice, direction]
              properties:
                cropId: { type: string }
                targetPrice: { type: number, minimum: 0.01 }
                direction: { type: string, enum: [above, below] }
                market: { type: string }
      responses:
        '201':
          description: Price alert saved.
        'default': { $ref: '#/components/responses/ApiError' }
  /weather/forecast:
    get:
      tags: [Weather]
      parameters:
        - { name: plotId, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 7 } }
        - { name: locale, in: query, schema: { type: string } }
        - { name: temperatureUnit, in: query, schema: { type: string, enum: [C, F] } }
        - { name: windUnit, in: query, schema: { type: string } }
        - { name: precipitationUnit, in: query, schema: { type: string } }
      responses:
        '200':
          description: Forecast, advisories, provider timestamp and stale flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherForecast' }
        'default': { $ref: '#/components/responses/ApiError' }
  /weather/cache:
    get:
      tags: [Weather]
      parameters:
        - { name: plotId, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
      responses:
        '200':
          description: Last available cached forecast.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherForecast' }
