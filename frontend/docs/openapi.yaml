        '200':
          description: Account-scoped delta including tombstones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        'default': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fs_access
      description: Short-lived JWT access cookie; Secure, HttpOnly, SameSite.
    refreshCookie:
      type: apiKey
      in: cookie
      name: fs_refresh
      description: Rotating refresh cookie; Secure, HttpOnly, SameSite.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PlotId:
      name: plotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Standard error. Possible HTTP statuses are 400, 401, 403, 404, 409, 413, 415, 422, 429, 500 and 503.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
            retryAfterSeconds: { type: integer }
    OtpRequest:
      type: object
      required: [phoneE164, purpose]
      properties:
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: Mobile number in strict E.164 format (e.g. +919876543210).
        purpose:
          type: string
          enum: [login]
          default: login
          description: Unified login and sign-up flow; server decides whether the number is new.
        channel:
          type: string
          enum: [sms, voice]
          default: sms
        locale:
          type: string
          description: Preferred locale for the localized SMS template.
    OtpChallenge:
      type: object
      required: [challengeId, expiresInSeconds, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresInSeconds: { type: integer, example: 300 }
        resendAfterSeconds: { type: integer, example: 30 }
        voiceAvailable: { type: boolean, default: false }
    OtpVerifyRequest:
      type: object
      required: [challengeId, phoneE164, code]
      properties:
        challengeId: { type: string, format: uuid }
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        code:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
        profile:
          $ref: '#/components/schemas/ProfilePatch'
    SessionResponse:
      type: object
      required: [user, csrfToken, isNewUser]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
        isNewUser:
          type: boolean
          description: True when this phone number was newly created or still requires name/consent completion.
    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    User:
      type: object
      required: [id, phoneE164, status, countryCode, preferredLocale, roles, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        status: { type: string, enum: [pending, active, disabled] }
        countryCode: { type: string }
        preferredLocale: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: object
      required: [code, scope, permissions]
      properties:
        code: { type: string, enum: [farmer, extension, admin] }
        scope: { type: string, enum: [global, group] }
        groupId: { type: [string, 'null'], format: uuid }
        permissions:
          type: array
          items: { type: string }
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    ProfilePatch:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        preferredLocale: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        smsOptIn: { type: boolean }
        privacyConsent: { type: boolean }
      additionalProperties: false
    PreferenceInput:
      type: object
      properties:
        locale: { type: string }
        theme: { type: string, enum: [system, light, dark] }
        areaUnit: { type: string }
        temperatureUnit: { type: string, enum: [C, F] }
        windUnit: { type: string }
        precipitationUnit: { type: string }
        sowingReminder: { type: boolean }
        fertilizerReminder: { type: boolean }
        notificationChannels:
          type: array
          uniqueItems: true
          items: { type: string, enum: [push, sms, whatsapp] }
      additionalProperties: false
    Preference:
      allOf:
        - { $ref: '#/components/schemas/PreferenceInput' }
        - type: object
          required: [userId, updatedAt]
          properties:
            userId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    GeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates:
          type: array
          description: GeoJSON coordinate arrays in [longitude, latitude] order.
          items: {}
    PlotCreate:
      type: object
      required: [clientMutationId, name, area, areaUnit, areaHectares, source]
      properties:
        clientMutationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        area: { type: number, exclusiveMinimum: 0 }
        areaUnit: { type: string, enum: [acre, hectare, guntha, sqm, sqft] }
        areaHectares: { type: number, exclusiveMinimum: 0 }
        village: { type: [string, 'null'] }
        primaryCropId: { type: [string, 'null'] }
        intercropId: { type: [string, 'null'] }
        boundary: { oneOf: [{ $ref: '#/components/schemas/GeoJSON' }, { type: 'null' }] }
        source: { type: string, enum: [manual, in-agristack, provider] }
        providerId: { type: [string, 'null'] }
        parcelRef: { type: [string, 'null'] }
      additionalProperties: false
    PlotPatch:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        area: { type: number, exclusiveMinimum: 0 }
        areaUnit: { type: string, enum: [acre, hectare, guntha, sqm, sqft] }
        areaHectares: { type: number, exclusiveMinimum: 0 }
        village: { type: [string, 'null'] }
        primaryCropId: { type: [string, 'null'] }
        intercropId: { type: [string, 'null'] }
        boundary: { oneOf: [{ $ref: '#/components/schemas/GeoJSON' }, { type: 'null' }] }
      additionalProperties: false
    Plot:
      allOf:
        - { $ref: '#/components/schemas/PlotCreate' }
        - type: object
          required: [id, ownerId, isVerified, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            isVerified: { type: boolean }
            verifiedAt: { type: [string, 'null'], format: date-time }
            externalId: { type: [string, 'null'] }
            provenance: { type: object, additionalProperties: true }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deletedAt: { type: [string, 'null'], format: date-time }
    PlotPage:
      type: object
      required: [items, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plot' } }
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    PlotSeasonCreate:
      type: object
      required: [seasonCode, year, cropId, status]
      properties:
        seasonCode: { type: string, enum: [Rabi, Kharif, Zaid] }
        year: { type: integer }
        cropId: { type: string }
        previousCropId: { type: [string, 'null'] }
        status: { type: string, enum: [planned, active, harvested, cancelled] }
        sourceRecommendationId: { type: [string, 'null'], format: uuid }
    PlotSeasonPatch:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        cropId: { type: string }
        status: { type: string, enum: [planned, active, harvested, cancelled] }
        previousCropId: { type: [string, 'null'] }
      additionalProperties: false
    PlotSeason:
      allOf:
        - { $ref: '#/components/schemas/PlotSeasonCreate' }
        - type: object
          required: [id, plotId, version, updatedAt]
          properties:
            id: { type: string, format: uuid }
            plotId: { type: string, format: uuid }
            version: { type: integer }
            updatedAt: { type: string, format: date-time }
    PlotSeasonPage:
      type: object
      required: [items, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlotSeason' } }
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    RegistryProvider:
      type: object
      required: [id, name, authMethod, available, scopes]
      properties:
        id: { type: string }
        name: { type: string }
        authMethod: { type: string, enum: [oauth, idNumber, otp, unavailable] }
        available: { type: boolean }
        scopes: { type: array, items: { type: string } }
        requirements: { type: array, items: { type: string } }
    ProviderPage:
      type: object
      required: [providers]
      properties:
        providers: { type: array, items: { $ref: '#/components/schemas/RegistryProvider' } }
    ConsentCreate:
      type: object
      required: [providerId, countryCode, scopes, purpose, noticeVersion]
      properties:
        providerId: { type: string }
        countryCode: { type: string }
        scopes: { type: array, minItems: 1, items: { type: string } }
        purpose: { type: string }
        noticeVersion: { type: string }
        returnUrl: { type: string, format: uri }
    ConsentStartResponse:
      type: object
      required: [consent, authorizationUrl]
      properties:
        consent: { $ref: '#/components/schemas/LandRegistryConsent' }
        authorizationUrl: { type: [string, 'null'], format: uri }
    LandRegistryConsent:
      type: object
      required: [id, providerId, countryCode, scopes, purpose, status, noticeVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string }
        countryCode: { type: string }
        scopes: { type: array, items: { type: string } }
        purpose: { type: string }
        status: { type: string, enum: [initiated, granted, denied, revoked, expired] }
        providerConsentRef: { type: [string, 'null'] }
        noticeVersion: { type: string }
        createdAt: { type: string, format: date-time }
        grantedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    ProviderCallback:
      type: object
      required: [state, code]
      properties:
        state: { type: string }
        code: { type: string }
        error: { type: string }
    LandRegistryParcel:
      type: object
      required: [id, providerId, countryCode, parcelRef, geometry, isVerified]
      properties:
        id: { type: string }
        providerId: { type: string }
        countryCode: { type: string }
        parcelRef: { type: string }
        geometry: { $ref: '#/components/schemas/GeoJSON' }
        areaHectares: { type: number }
        landUse: { type: string }
        cropDeclared: { type: string }
        ownerStatus: { type: string, enum: [owner, tenant, unknown] }
        source: { type: string }
        isVerified: { type: boolean }
        verifiedAt: { type: [string, 'null'], format: date-time }
        registryUrl: { type: [string, 'null'], format: uri }
    ParcelPage:
      type: object
      required: [items, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LandRegistryParcel' } }
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    ParcelImportRequest:
      type: object
      required: [consentId, parcelIds]
      properties:
        consentId: { type: string, format: uuid }
        parcelIds: { type: array, minItems: 1, items: { type: string } }
    ParcelImportResponse:
      type: object
      required: [plots, importedCount, skippedCount]
      properties:
        plots: { type: array, items: { $ref: '#/components/schemas/Plot' } }
        importedCount: { type: integer }
        skippedCount: { type: integer }
    RecommendationRequest:
      type: object
      required: [plotId, seasonCode, year, locale]
      properties:
        plotId: { type: string, format: uuid }
